<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Post Classifier</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body class="popup-body">
  <div class="header"><div class="header-title">LinkedIn Classifier</div></div>
  <main class="scroll-wrap">
    <div class="toggle-row">
      <span class="toggle-label">Enable classification</span>
      <label class="switch"><input type="checkbox" id="enableToggle"><span class="slider"></span></label>
    </div>
    <div class="card">
      <label for="apiKey">Vercel AI Gateway API key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="AI Gateway API key">
      <label for="model">Model ID</label>
      <input id="model" type="text" placeholder="provider/model">
      <label for="filters">Positive filters</label>
      <textarea id="filters" rows="3" placeholder="Roles, skills, seniority, industries…"></textarea>
      <label for="negativeFilters">Negative filters</label>
      <textarea id="negativeFilters" rows="3" placeholder="Technologies, roles, conditions to avoid…"></textarea>
      <label for="threshold">Hide posts below: <span id="thresholdValue">65</span>/100</label>
      <input id="threshold" type="range" min="0" max="100" value="65">
      <button id="saveConfig" class="primary">Save configuration</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </main>
  <div class="status-bar"><span>Only configuration is stored; posts are not saved.</span></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
